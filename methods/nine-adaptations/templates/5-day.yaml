# Five-day week for a general strength-and-conditioning athlete.
# Frame: NA-DES-008 (policy). The three-day rotation runs with fewer rest
# days, and lifting splits into a lower-body and an upper-body emphasis so a
# muscle gets about 48 hours between hard sessions (NA-HYP-005). Anaerobic
# capacity and maximal aerobic work fall on different days (NA-END-003).
#
# Format and rounding: see 3-day.yaml. Only the hypertrophy emphasis must put
# every muscle inside 10-20 hard sets a week (NA-HYP-001).

pack: nine-adaptations
version: 1
name: five-day
days: 5
# Plain lines for the athlete: why the week looks as it does (the setup and block
# skills show them before the week table). At most 25 words each; no rule ids.
why:
  - "Five days repeat the three-day rotation with fewer rest days."
  - "Lifting splits into lower-body and upper-body days, so each muscle gets about 48 hours to recover between hard sessions."
  - "Your goal gets the most sets. The other qualities get a smaller dose, so you keep them while the goal improves."
  - "Each build week adds about 5% more sets, and never more than 10% over the week before."
  - "Every sixth week is lighter: about 70% of the sets and loads, so your body can recover and adapt."
week:
  - day: 1
    focus: "Speed and power, then lower-body hypertrophy"
    why: "Fast jumps first while you are fresh, then lower-body lifts for muscle size."
    slots:
      - { pattern: plyometric, adaptation: power, sets: 3, reps: 3, rest_s: 180, note: "jumps, every rep as fast as possible" }
      - { pattern: squat, adaptation: hypertrophy, sets: 4, reps: [6, 10], rest_s: 150 }
      - { pattern: hinge, adaptation: hypertrophy, sets: 2, reps: [8, 12], rest_s: 120 }
      - { pattern: lunge, adaptation: hypertrophy, sets: 2, reps: [8, 12], rest_s: 90 }
      - { pattern: knee_flexion, adaptation: hypertrophy, sets: 4, reps: [10, 15], rest_s: 60 }
      - { pattern: carry, adaptation: strength, sets: 4, duration: 40, rest_s: 180, note: "heavy carry" }
      - { pattern: shrug, adaptation: hypertrophy, sets: 2, reps: [10, 15], rest_s: 60 }
  - day: 2
    focus: "Upper-body strength, then anaerobic intervals"
    why: "Heavy upper-body lifts for strength, then hard intervals on a different day from the maximal effort."
    slots:
      - { pattern: horizontal_push, adaptation: strength, sets: 4, reps: [3, 5], rest_s: 180 }
      - { pattern: horizontal_pull, adaptation: strength, sets: 4, reps: [3, 5], rest_s: 180, note: "superset with the push" }
      - { pattern: overhead_press, adaptation: hypertrophy, sets: 4, reps: [8, 12], rest_s: 90 }
      - { pattern: vertical_pull, adaptation: hypertrophy, sets: 3, reps: [8, 12], rest_s: 90, note: "superset with the push" }
      - { pattern: rear_delt, adaptation: hypertrophy, sets: 3, reps: [12, 20], rest_s: 60 }
      - { pattern: intervals, adaptation: anaerobic_capacity, sets: 6, duration: 30, rest_s: 30, note: "30 s hard, 30 s easy" }
  - day: 3
    focus: "Long-duration endurance"
    why: "A long, easy session at a pace where you can breathe through your nose builds your aerobic base."
    slots:
      - { pattern: zone2_cardio, adaptation: long_duration, sets: 1, duration: [2700, 3600], rest_s: 0, note: "nasal-breathing pace" }
      - { pattern: mobility, adaptation: recovery, sets: 1, duration: 600, rest_s: 0 }
      - { pattern: breathing, adaptation: recovery, sets: 1, duration: 300, rest_s: 0 }
  - day: 4
    focus: "Lower-body strength, then upper-body hypertrophy"
    why: "Heavy lower-body lifts for strength, then upper-body lifts for muscle size."
    slots:
      - { pattern: plyometric, adaptation: power, sets: 3, reps: 3, rest_s: 180, note: "throws or short sprints" }
      - { pattern: squat, adaptation: strength, sets: 3, reps: [3, 5], rest_s: 180 }
      - { pattern: hinge, adaptation: strength, sets: 3, reps: [3, 5], rest_s: 180 }
      - { pattern: horizontal_push, adaptation: hypertrophy, sets: 3, reps: [8, 12], rest_s: 90 }
      - { pattern: vertical_pull, adaptation: hypertrophy, sets: 3, reps: [8, 12], rest_s: 90, note: "superset with the push" }
      - { pattern: lateral_raise, adaptation: hypertrophy, sets: 4, reps: [12, 20], rest_s: 60 }
      - { pattern: elbow_flexion, adaptation: hypertrophy, sets: 2, reps: [10, 15], rest_s: 60, note: "superset with the lateral raise" }
  - day: 5
    focus: "Muscular endurance, then a maximal aerobic effort"
    why: "Many lighter reps for endurance, then one hard effort near your maximum heart rate."
    slots:
      - { pattern: horizontal_push, adaptation: muscular_endurance, sets: 3, reps: [15, 30], rest_s: 60, note: "push-ups" }
      - { pattern: horizontal_pull, adaptation: muscular_endurance, sets: 2, reps: [12, 20], rest_s: 60 }
      - { pattern: knee_extension, adaptation: muscular_endurance, sets: 2, reps: [15, 25], rest_s: 60 }
      - { pattern: rotation, adaptation: muscular_endurance, sets: 3, reps: [12, 20], rest_s: 45 }
      - { pattern: carry, adaptation: muscular_endurance, sets: 5, duration: 60, rest_s: 60 }
      - { pattern: intervals, adaptation: max_aerobic, sets: 1, duration: [300, 900], rest_s: 0, note: "one sustained hard effort, for example a timed mile" }
emphasis:
  all-around: {}
  strength: { strength: 1.34, power: 1.34, hypertrophy: 0.75, muscular_endurance: 0.67, anaerobic_capacity: 0.67, max_aerobic: 0.67, long_duration: 0.75 }
  hypertrophy: { hypertrophy: 1.5, strength: 1.0, muscular_endurance: 1.34, power: 0.67, anaerobic_capacity: 0.67, max_aerobic: 0.67, long_duration: 0.67 }
  endurance: { long_duration: 1.5, anaerobic_capacity: 1.34, max_aerobic: 1.5, muscular_endurance: 1.5, strength: 0.75, hypertrophy: 0.75, power: 0.67 }
  general-health: { long_duration: 1.25, strength: 0.75, hypertrophy: 0.75, power: 0.67, anaerobic_capacity: 0.67, max_aerobic: 0.75 }
