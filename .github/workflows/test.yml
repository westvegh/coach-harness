name: test

# CI runs on the template repository only. A copy made for an athlete commits private
# athlete files and runs no CI by default; to turn CI on in your copy, set the repository
# variable COACH_CI to true (Settings > Secrets and variables > Actions > Variables).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'westvegh/coach-harness' || vars.COACH_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The update skill runs `npm test` in an athlete's copy, so the suite must also pass
      # there: a committed copy with coach.yaml and made-up athlete files.
      - name: npm test in an athlete copy
        run: |
          copy="$(mktemp -d)"
          git archive HEAD | tar -x -C "$copy"
          cd "$copy"
          cp coach.example.yaml coach.yaml
          mkdir -p athlete/log plans .tmp/coach
          cp templates/athlete/limits.md athlete/limits.md
          printf '# Brief\n\n## Preferences\n\n- 8-12 reps on the main lifts\n' > athlete/brief.md
          printf 'setup: finish done 2026-10-12 15:33\n' > athlete/log/setup.md
          printf 'date,day,exercise,sets,reps,load,unit,notes,done_sets,done_reps,done_load,felt\n2026-10-19,Lower,Hack Squat,4,10,,,,,,,\n' > plans/2026-W43.csv
          printf '{}\n' > .tmp/coach/history.json
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "athlete copy"
          npm ci
          npm test
