name: test

# CI runs on the template repository only. A copy made for an athlete commits private
# athlete files and runs no CI by default; to turn CI on in your copy, set the repository
# variable COACH_CI to true (Settings > Secrets and variables > Actions > Variables).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'westvegh/coach-harness' || vars.COACH_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
