name: Bug report
description: Something in coach-harness does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste your athlete files, health data, tokens or personal details here. This issue is public.
        For a security problem, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the words you said to the coach, in order.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error or the engine output (`node engine/cli.ts …`). Remove personal data first.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version` and `node --version`, and the coach-harness version or commit.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Manual (interactive), Mac (launchd), Cloud (routine), Not sure]
    validations:
      required: true
