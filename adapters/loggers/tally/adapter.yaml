# Tally logger adapter (contracts §12). Read by engine/logger.ts.
# Tool names are suffixes: the full name is mcp__<server>__<suffix>, where the server
# part differs per connector (spike #10): mcp__tally__…, mcp__Tally_Workout__…,
# mcp__claude_ai_Tally_Workout__….
version: 1
name: tally
tools:
  reads:
    planned_day: get_planned_workout
    training_context: get_training_context
    history: get_workout_history
  mutations:
    plan_day: plan_workout_day
    plan_range: plan_workout_range
    update: update_planned_workout
    move: move_planned_workout
    skip: skip_planned_workout
    delete: delete_planned_workout
    profile: update_user_profile
  # Tally track T3 (Tally server-limits spec §6.2): add rules and lower caps only.
  # The guard treats it as a limit change: ask interactive, deny unattended.
  limits:
    update: update_training_limits
# guard-writes matcher (contracts §7). settings.json carries the same regex; a test
# keeps them equal.
matcher: "^mcp__.*[Tt]ally.*__(plan_workout_day|plan_workout_range|update_planned_workout|move_planned_workout|skip_planned_workout|delete_planned_workout|update_user_profile|update_training_limits)$"
# capture-reads matcher: the reads plus the mutations (their responses update the snapshot).
capture_matcher: "^mcp__.*[Tt]ally.*__(get_planned_workout|get_training_context|get_workout_history|plan_workout_day|plan_workout_range|update_planned_workout|move_planned_workout|skip_planned_workout|delete_planned_workout|update_user_profile|update_training_limits)$"
capabilities:
  # Tally track T2 (safe writes, in production since 2026-10-09):
  # - rangeCreateIfAbsent: a range only creates; every day carries ifAbsent: true.
  # - versionedSkipDelete: skip and delete carry expectedVersion, checked like any write.
  # - opId: calls may carry an idempotency key; the log records the submitted id, and a
  #   replay (replayed: true) is logged as history and the days are read again.
  rangeCreateIfAbsent: true
  versionedSkipDelete: true
  opId: true
  # Tally skips a day whose source is not "mcp" or that the user modified, unless the
  # call sets overrideUserModified (authority.ts).
  protectsUserDays: true
  # Tally track T3: server-side training limits. True only when the connected tool list
  # holds this tool (engine/logger.ts serverLimits); a server with the flag off lists none.
  server_limits: { when_tool: update_training_limits }
