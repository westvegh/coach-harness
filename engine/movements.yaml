# Movement taxonomy (contracts §3). Ships with the harness; PROTECTED.
# athlete/movements.local.yaml has the same shape and wins when both define an entry.
#
# regions:   body regions that limits and pain refer to. A side region (left-knee)
#            also matches its parent (knee).
# patterns:  what a movement loads (regions) and trains (muscles, for weekly sets).
#            recovery: true marks recovery-day patterns; they load no region.
# keywords:  lowercase words → patterns. A keyword matches whole words in the exercise
#            name (a plural "s" or "es" is allowed). The longest match wins.
# exercises: exact name or exerciseId → patterns. Beats keywords.
version: 1

regions:
  - neck
  - upper-back
  - low-back
  - chest
  - abdomen
  - shoulder
  - left-shoulder
  - right-shoulder
  - elbow
  - left-elbow
  - right-elbow
  - wrist
  - left-wrist
  - right-wrist
  - hand
  - hip
  - left-hip
  - right-hip
  - groin
  - knee
  - left-knee
  - right-knee
  - ankle
  - left-ankle
  - right-ankle
  - foot

patterns:
  # lower body
  squat:                    { loads: [knee, hip, low-back], muscles: [quads, glutes] }
  loaded_deep_knee_flexion: { loads: [knee], muscles: [] }
  lunge:                    { loads: [knee, hip], muscles: [quads, glutes] }
  step_up:                  { loads: [knee, hip], muscles: [quads, glutes] }
  leg_press:                { loads: [knee, hip], muscles: [quads, glutes] }
  knee_extension:           { loads: [knee], muscles: [quads] }
  knee_flexion:             { loads: [knee], muscles: [hamstrings] }
  hinge:                    { loads: [low-back, hip], muscles: [hamstrings, glutes] }
  hinge_isometric:          { loads: [low-back, hip], muscles: [] }
  hip_thrust:               { loads: [hip], muscles: [glutes] }
  back_extension:           { loads: [low-back, hip], muscles: [glutes, hamstrings] }
  hip_abduction:            { loads: [hip], muscles: [glutes] }
  hip_adduction:            { loads: [hip, groin], muscles: [adductors] }
  calf_raise:               { loads: [ankle, foot], muscles: [calves] }
  ankle_dorsiflexion:       { loads: [ankle], muscles: [] }
  sled:                     { loads: [knee, hip, ankle], muscles: [quads, glutes] }
  # upper body push
  horizontal_push:          { loads: [shoulder, elbow, wrist], muscles: [chest, triceps] }
  incline_push:             { loads: [shoulder, elbow, wrist], muscles: [chest, shoulders] }
  vertical_push:            { loads: [shoulder, elbow, wrist], muscles: [chest, triceps] }
  overhead_press:           { loads: [shoulder, elbow], muscles: [shoulders, triceps] }
  chest_fly:                { loads: [shoulder, chest], muscles: [chest] }
  # upper body pull
  horizontal_pull:          { loads: [shoulder, elbow, upper-back], muscles: [upper-back, lats] }
  vertical_pull:            { loads: [shoulder, elbow], muscles: [lats, biceps] }
  lateral_raise:            { loads: [shoulder], muscles: [shoulders] }
  rear_delt:                { loads: [shoulder], muscles: [shoulders, upper-back] }
  shoulder_rotation:        { loads: [shoulder], muscles: [shoulders] }
  shrug:                    { loads: [neck, upper-back], muscles: [traps] }
  neck_work:                { loads: [neck], muscles: [neck] }
  # arms
  elbow_flexion:            { loads: [elbow, wrist], muscles: [biceps] }
  elbow_extension:          { loads: [elbow], muscles: [triceps] }
  wrist_forearm:            { loads: [wrist, hand], muscles: [forearms] }
  # trunk
  loaded_spinal_flexion:    { loads: [low-back, abdomen], muscles: [core] }
  core_anti_extension:      { loads: [low-back, abdomen], muscles: [core] }
  core_anti_rotation:       { loads: [abdomen], muscles: [core] }
  core_lateral:             { loads: [low-back, abdomen], muscles: [core] }
  rotation:                 { loads: [low-back, abdomen], muscles: [core] }
  carry:                    { loads: [shoulder, wrist, hand, low-back, hip], muscles: [forearms, traps, core] }
  # power and conditioning
  olympic_lift:             { loads: [knee, hip, low-back, shoulder, wrist], muscles: [quads, glutes, hamstrings, traps] }
  plyometric:               { loads: [knee, ankle, hip, foot], muscles: [] }
  sprint:                   { loads: [knee, ankle, hip, foot], muscles: [] }
  impact_running:           { loads: [knee, ankle, hip, foot], muscles: [] }
  rowing_erg:               { loads: [low-back, knee, shoulder], muscles: [] }
  balance:                  { loads: [ankle, foot], muscles: [] }
  # walking under a load (a ruck): the lower body carries it too (P3)
  loaded_walk:              { loads: [knee, ankle], muscles: [] }
  intervals:                { loads: [], muscles: [] }
  # recovery
  zone2_cardio:             { loads: [], muscles: [], recovery: true }
  mobility:                 { loads: [], muscles: [], recovery: true }
  breathing:                { loads: [], muscles: [], recovery: true }

